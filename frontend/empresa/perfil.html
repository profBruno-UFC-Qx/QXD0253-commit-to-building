<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dados cadastrais da empresa." />
    <meta name="robots" content="noindex" />
    <title>Minha empresa | Portal de Empregos do Transporte de Cargas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/estilos/principal.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header id="topo"></header>

    <main id="conteudo" class="flex-grow-1 py-4">
      <div class="container caixa-formulario-larga">
        <div class="card cartao">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
              <h1 class="h4 mb-0">Minha empresa</h1>
              <span id="selo-situacao"></span>
            </div>
            <div id="mensagem" aria-live="polite"></div>
            <form id="form-empresa" novalidate>
              <div class="row g-3">
                <div class="col-sm-8">
                  <label for="nome" class="form-label">Nome da empresa</label>
                  <input type="text" class="form-control" id="nome" name="nome" minlength="2" maxlength="120" required />
                  <div class="invalid-feedback">Informe o nome da empresa.</div>
                </div>
                <div class="col-sm-4">
                  <label for="cnpj" class="form-label">CNPJ</label>
                  <input type="text" class="form-control" id="cnpj" readonly aria-describedby="ajuda-cnpj" />
                  <div class="form-text" id="ajuda-cnpj">O CNPJ não pode ser alterado.</div>
                </div>
                <div class="col-sm-6">
                  <label for="cidade" class="form-label">Cidade</label>
                  <input type="text" class="form-control" id="cidade" name="cidade" list="cidades" maxlength="80" required />
                  <datalist id="cidades"></datalist>
                  <div class="invalid-feedback">Informe a cidade.</div>
                </div>
                <div class="col-sm-6">
                  <label for="telefone" class="form-label">Telefone</label>
                  <input type="tel" class="form-control" id="telefone" name="telefone" inputmode="tel" required />
                  <div class="invalid-feedback">Informe o telefone com DDD.</div>
                </div>
                <div class="col-12">
                  <label for="descricao" class="form-label">Descrição <span class="text-body-secondary small">(opcional)</span></label>
                  <textarea class="form-control" id="descricao" name="descricao" rows="4" maxlength="2000"></textarea>
                </div>
              </div>
              <div class="d-flex justify-content-end mt-4">
                <button type="submit" class="btn btn-primary" id="botao-salvar"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Salvar alterações</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer id="rodape"></footer>
    <script type="module" src="/src/paginas/empresa/perfil.ts"></script>
  </body>
</html>
