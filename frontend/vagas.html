<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vagas abertas para motoristas de caminhão e operadores de máquinas na Região Metropolitana de Fortaleza." />
    <title>Vagas | Portal de Empregos do Transporte de Cargas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/estilos/principal.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header id="topo"></header>

    <main id="conteudo" class="flex-grow-1 py-4">
      <div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-2 mb-3">
          <div>
            <h1 class="h3 mb-1">Vagas abertas</h1>
            <p class="text-body-secondary mb-0" id="resumo" aria-live="polite">&nbsp;</p>
          </div>
          <div id="filtro-empresa"></div>
        </div>

        <form id="form-filtros" class="card cartao mb-4" role="search" aria-label="Filtrar vagas">
          <div class="card-body row g-2 align-items-end">
            <div class="col-12 col-lg-4">
              <label for="busca" class="form-label small mb-1">Buscar</label>
              <input type="search" class="form-control" id="busca" name="busca" placeholder="Ex.: rodotrem, pá carregadeira" />
            </div>
            <div class="col-6 col-lg-2">
              <label for="cidade" class="form-label small mb-1">Cidade</label>
              <select class="form-select" id="cidade" name="cidade">
                <option value="">Todas</option>
              </select>
            </div>
            <div class="col-6 col-lg-2">
              <label for="tipo" class="form-label small mb-1">Tipo</label>
              <select class="form-select" id="tipo" name="tipo">
                <option value="">Todos</option>
                <option value="motorista">Motorista</option>
                <option value="operador">Operador de máquinas</option>
              </select>
            </div>
            <div class="col-6 col-lg-2">
              <label for="cnh" class="form-label small mb-1">Minha CNH</label>
              <select class="form-select" id="cnh" name="cnh">
                <option value="">Qualquer</option>
                <option value="nenhuma">Não tenho</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="E">E</option>
              </select>
            </div>
            <div class="col-6 col-lg-2">
              <label for="ordem" class="form-label small mb-1">Ordenar por</label>
              <select class="form-select" id="ordem" name="ordem">
                <option value="recentes">Mais recentes</option>
                <option value="salario">Maior salário</option>
              </select>
            </div>
            <div class="col-12 d-flex gap-2 justify-content-end">
              <button type="reset" class="btn btn-link text-decoration-none">Limpar filtros</button>
              <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1" aria-hidden="true"></i>Buscar</button>
            </div>
          </div>
        </form>

        <div id="lista"></div>
      </div>
    </main>

    <footer id="rodape"></footer>
    <script type="module" src="/src/paginas/vagas.ts"></script>
  </body>
</html>
