<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Currículo do candidato." />
    <meta name="robots" content="noindex" />
    <title>Meu currículo | Portal de Empregos do Transporte de Cargas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/estilos/principal.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header id="topo"></header>

    <main id="conteudo" class="flex-grow-1 py-4">
      <div class="container caixa-formulario-larga">
        <div id="aviso" aria-live="polite"></div>
        <div class="card cartao">
          <div class="card-body p-4">
            <h1 class="h4 mb-1" id="titulo-pagina">Meu currículo</h1>
            <p class="text-body-secondary small">As empresas veem estes dados quando você se candidata a uma vaga delas.</p>
            <div id="mensagem" aria-live="polite"></div>
            <form id="form-curriculo" novalidate>
              <div class="row g-3">
                <div class="col-sm-8">
                  <label for="nome" class="form-label">Nome completo</label>
                  <input type="text" class="form-control" id="nome" name="nome" minlength="2" maxlength="120" autocomplete="name" required />
                  <div class="invalid-feedback">Informe o seu nome.</div>
                </div>
                <div class="col-sm-4">
                  <label for="telefone" class="form-label">Telefone / WhatsApp</label>
                  <input type="tel" class="form-control" id="telefone" name="telefone" inputmode="tel" placeholder="(85) 99999-9999" autocomplete="tel" required />
                  <div class="invalid-feedback">Informe o telefone com DDD.</div>
                </div>
                <div class="col-sm-6">
                  <label for="cidade" class="form-label">Cidade onde mora</label>
                  <input type="text" class="form-control" id="cidade" name="cidade" list="cidades" maxlength="80" required />
                  <datalist id="cidades"></datalist>
                  <div class="invalid-feedback">Informe a cidade.</div>
                </div>
                <div class="col-6 col-sm-3">
                  <label for="cnh" class="form-label">Categoria da CNH</label>
                  <select class="form-select" id="cnh" name="cnh">
                    <option value="nenhuma">Não tenho</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                  </select>
                </div>
                <div class="col-6 col-sm-3">
                  <label for="anosExperiencia" class="form-label">Anos de experiência</label>
                  <input type="number" class="form-control" id="anosExperiencia" name="anosExperiencia" min="0" max="60" step="1" value="0" required />
                  <div class="invalid-feedback">De 0 a 60.</div>
                </div>
                <div class="col-12">
                  <label for="equipamentos" class="form-label">Veículos e máquinas que já operou <span class="text-body-secondary small">(opcional)</span></label>
                  <input type="text" class="form-control" id="equipamentos" name="equipamentos" maxlength="300" placeholder="Ex.: rodotrem, truck, pá carregadeira" />
                </div>
                <div class="col-12">
                  <label for="resumo" class="form-label">Resumo da experiência <span class="text-body-secondary small">(opcional)</span></label>
                  <textarea class="form-control" id="resumo" name="resumo" rows="5" maxlength="2000" placeholder="Onde trabalhou, rotas que fez, cursos (MOPP, operador de máquinas)..."></textarea>
                </div>
              </div>
              <div class="d-flex justify-content-end mt-4">
                <button type="submit" class="btn btn-primary" id="botao-salvar"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Salvar currículo</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer id="rodape"></footer>
    <script type="module" src="/src/paginas/candidato/curriculo.ts"></script>
  </body>
</html>
