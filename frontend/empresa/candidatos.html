<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Candidatos às vagas da empresa." />
    <meta name="robots" content="noindex" />
    <title>Candidatos | Portal de Empregos do Transporte de Cargas</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/estilos/principal.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header id="topo"></header>

    <main id="conteudo" class="flex-grow-1 py-4">
      <div class="container">
        <nav aria-label="Caminho" class="mb-3">
          <ol class="breadcrumb small mb-0">
            <li class="breadcrumb-item"><a href="/empresa/painel.html">Painel</a></li>
            <li class="breadcrumb-item active" aria-current="page">Candidatos</li>
          </ol>
        </nav>
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-2 mb-3">
          <div>
            <h1 class="h3 mb-1">Candidatos</h1>
            <p class="text-body-secondary mb-0" id="resumo">&nbsp;</p>
          </div>
          <div class="d-flex gap-2">
            <div>
              <label for="filtro-vaga" class="form-label small mb-1">Vaga</label>
              <select class="form-select" id="filtro-vaga"><option value="">Todas as vagas</option></select>
            </div>
            <div>
              <label for="filtro-situacao" class="form-label small mb-1">Situação</label>
              <select class="form-select" id="filtro-situacao">
                <option value="">Todas</option>
                <option value="enviada">Enviada</option>
                <option value="em_analise">Em análise</option>
                <option value="aprovada">Aprovada</option>
                <option value="recusada">Recusada</option>
              </select>
            </div>
          </div>
        </div>
        <div id="mensagem" aria-live="polite"></div>
        <div id="lista"></div>
      </div>
    </main>

    <footer id="rodape"></footer>
    <script type="module" src="/src/paginas/empresa/candidatos.ts"></script>
  </body>
</html>
